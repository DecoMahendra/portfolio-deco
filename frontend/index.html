<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Warna bilah atas browser di HP, disamakan dengan latar halaman
         supaya batas antara browser dan website tidak terlihat. -->
    <meta name="theme-color" content="#09090B" />

    <!-- ============================================================
         SEO DASAR
         ============================================================ -->
    <title>Deco Mahendra — Full Stack Developer</title>

    <!-- Kalimat yang muncul di bawah judul pada hasil pencarian Google.
         Panjang idealnya 150-160 huruf; lebih dari itu dipotong. -->
    <meta
      name="description"
      content="Portfolio Deco Mahendra — Full Stack Developer dan mahasiswa D4 Sistem Informasi Kota Cerdas. Membangun aplikasi web dengan React, Laravel, dan MySQL."
    />
    <meta name="author" content="Deco Mahendra" />

    <!-- Alamat resmi halaman ini. Kalau suatu saat website bisa dibuka lewat
         beberapa alamat berbeda, baris ini memberi tahu Google mana yang asli
         supaya nilainya tidak terbagi. -->
    <link rel="canonical" href="https://decomahendra.vercel.app/" />

    <!-- ============================================================
         OPEN GRAPH
         Dipakai WhatsApp, LinkedIn, Facebook, dan Discord untuk membuat
         kotak pratinjau saat link ini dibagikan.
         ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://decomahendra.vercel.app/" />
    <meta property="og:title" content="Deco Mahendra — Full Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio Deco Mahendra — Full Stack Developer dan mahasiswa D4 Sistem Informasi Kota Cerdas. Membangun aplikasi web dengan React, Laravel, dan MySQL."
    />
    <meta property="og:site_name" content="Deco Mahendra" />
    <meta property="og:locale" content="id_ID" />

    <!-- Gambar pratinjau. Alamatnya wajib lengkap dengan https:// —
         alamat seperti /og-image.png tidak dikenali WhatsApp maupun LinkedIn. -->
    <meta property="og:image" content="https://decomahendra.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Deco Mahendra — Full Stack Developer" />

    <!-- ============================================================
         TWITTER / X
         ============================================================ -->
    <!-- summary_large_image = kotak besar bergambar, bukan kotak kecil. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://decomahendra.vercel.app/og-image.png" />
    <meta name="twitter:title" content="Deco Mahendra — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Portfolio Deco Mahendra — Full Stack Developer dan mahasiswa D4 Sistem Informasi Kota Cerdas."
    />

    <!-- ============================================================
         DATA TERSTRUKTUR
         Format yang dibaca mesin pencari untuk memahami bahwa halaman ini
         tentang seseorang — bukan sekadar kumpulan teks. Membantu Google
         menghubungkan namamu dengan profil GitHub dan LinkedIn-mu.

         Email sengaja tidak dimasukkan supaya tidak menambah jejak yang
         mudah dipanen bot pengirim spam.
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Deco Mahendra",
        "url": "https://decomahendra.vercel.app/",
        "jobTitle": "Full Stack Developer",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Indramayu",
          "addressRegion": "Jawa Barat",
          "addressCountry": "ID"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Politeknik Negeri Indramayu"
        },
        "sameAs": [
          "https://github.com/DecoMahendra",
          "https://www.linkedin.com/in/deco-mahendra"
        ]
      }
    </script>

    <!-- Font dimuat sendiri lewat @font-face di src/index.css.
         Tidak lagi mengambil dari Google Fonts — lihat penjelasannya di sana. -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
